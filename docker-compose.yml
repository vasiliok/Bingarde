# Docker setup for bingarde (TurboGears2 + PostgreSQL).
#
# Two ways to use it, selected with a compose "profile":
#
#   Run the TESTS (db + pytest), then exit:
#     docker compose --profile test up --build --abort-on-container-exit
#
#   Run the real APP (db + web + nginx), stays running:
#     docker compose --profile run up --build
#     -> open http://localhost:8080
#   Optional: BINGARDE_PORT=8081 (host port), BINGARDE_MAX_UPLOAD=50g
#   (largest upload nginx accepts, default 20g), BINGARDE_BIND=0.0.0.0
#   (listen on all interfaces, not just localhost).
#
#   The same app loaded with the demo builds (demo/demo-builds.zip, once):
#     docker compose --profile run --profile demo up --build -d
#
#   The same app with files in S3 instead of the "store" volume: add the
#   docker-compose.s3.yml file, see there.
#
# The "db" service has no profile, so it starts for either one.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bingarde
      # Demo value. The database is not published to the host; still, set
      # POSTGRES_PASSWORD for a real deployment (it takes effect when the
      # database volume is first created).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bingarde}
      POSTGRES_DB: bingarde
    volumes:
      # Creates the second database used by the test suite.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingarde -d bingarde"]
      interval: 3s
      timeout: 3s
      retries: 30

  # ---- TESTS ------------------------------------------------------------
  app:
    build: .
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://bingarde:${POSTGRES_PASSWORD:-bingarde}@db/bingarde_test
      # The S3 storage tests run against the "s3" service; without this
      # variable they are skipped.
      S3_TEST_ENDPOINT: http://s3:5000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    command: pytest -v

  # S3-compatible test store (moto, an S3 fake that keeps everything in
  # memory). The tests create their own buckets in it.
  s3:
    image: motoserver/moto:5.2.3
    profiles: ["test"]

  # ---- REAL APP: TurboGears2 (gunicorn) ---------------------------------
  web:
    build: .
    profiles: ["run"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://bingarde:${POSTGRES_PASSWORD:-bingarde}@db/bingarde
      # Demo value only. Set a long random string for any real deployment.
      SESSION_SECRET: change-me-demo-only
      BASE_URL: http://localhost:8080/
      # Demo: e-mail-only login; admin@example.org is admin and everyone who
      # signs in may write (python -m bingarde.manage demo-access). For a real
      # deployment turn DEV_LOGIN off and make the first admin with
      # "python -m bingarde.manage make-admin EMAIL" (docs/access.md).
      DEV_LOGIN: "1"
      # Real sign-in with an OpenID Connect provider (docs/login.md): export
      # these before "docker compose up". For Google, GOOGLE_CLIENT_ID and
      # GOOGLE_CLIENT_SECRET alone are enough.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # nginx sends downloads (X-Accel-Redirect to its internal /_store/).
      XACCEL: "1"
    volumes:
      - static:/app/staticfiles
      # Uploaded build files. Shared with nginx.
      - store:/data/store

  # ---- REAL APP: nginx (reverse proxy + static) -------------------------
  nginx:
    image: nginx:1.27-alpine
    profiles: ["run"]
    depends_on:
      - web
    ports:
      # Only this machine can open the demo (DEV_LOGIN lets anyone sign in as
      # admin). BINGARDE_BIND=0.0.0.0 opens it to the network.
      - "${BINGARDE_BIND:-127.0.0.1}:${BINGARDE_PORT:-8080}:80"
    environment:
      NGINX_MAX_BODY_SIZE: ${BINGARDE_MAX_UPLOAD:-20g}
    volumes:
      # Rendered into conf.d/default.conf at startup (envsubst).
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      # Pages for errors nginx answers itself (404, 413, 429, 502, ...).
      - ./nginx/errors:/var/www/errors:ro
      - static:/var/www/static:ro
      - store:/var/www/store:ro

  # ---- DEMO: load the demo builds once, then exit -----------------------
  # Only with DEV_LOGIN (the demo setup), and only into a server with no
  # builds yet. Uses a write token of admin@example.org that it deletes again.
  demo-seed:
    build: .
    profiles: ["demo"]
    depends_on:
      - web
    environment:
      DATABASE_URL: postgresql+psycopg://bingarde:${POSTGRES_PASSWORD:-bingarde}@db/bingarde
      DEV_LOGIN: "1"
      BINGARDE_URL: http://web:8000
    volumes:
      - ./demo:/demo:ro
    command: python -m bingarde.lib.demo_seed /demo/seed.py /demo/demo-builds.zip

volumes:
  pgdata:
  static:
  store:
