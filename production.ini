# Settings for the Docker "run" stack. Secrets and the database URL come
# from environment variables (see bingarde/config/middleware.py).
[app:main]
use = call:bingarde.config.middleware:make_app
debug = false
sqlalchemy.url = postgresql+psycopg://bingarde:bingarde@db/bingarde
sqlalchemy.pool_pre_ping = true

# Uploaded build files (env STORE_DIR) and the public URL used in e-mails (env BASE_URL).
store_dir = /data/store
base_url = http://localhost:8080/

# Who may sign in (comma-separated domains, empty = any Google account) and who
# is admin (comma-separated e-mails). Env: ALLOWED_EMAIL_DOMAINS, ADMIN_EMAILS.
allowed_email_domains =
admin_emails =
# Users who may not sign in or use their tokens any more (comma-separated
# e-mails, env BLOCKED_EMAILS). Takes effect at once, also for open sessions.
blocked_emails =
# Who may create and change builds and make write tokens (comma-separated
# e-mails / domains, "*" = every signed-in user). Others can only read; admins
# can always write. Env: WRITER_EMAILS, WRITER_DOMAINS.
writer_emails =
writer_domains =
# E-mail-only login for demos. Env DEV_LOGIN=1. Never enable in production.
dev_login = false

# Let nginx send downloads (X-Accel-Redirect). Needs the internal /_store/
# location in nginx/default.conf.
xaccel = false

# Largest request body in bytes, except file uploads (env MAX_REQUEST_BODY).
# Uploads are limited by nginx (BINGARDE_MAX_UPLOAD).
max_request_body = 2097152

session.type = file
session.data_dir = /tmp/bingarde/sessions
session.lock_dir = /tmp/bingarde/sessions/lock
session.httponly = true
session.samesite = Lax
# Log out after 14 days without activity.
session.timeout = 1209600

[loggers]
keys = root, bingarde, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_bingarde]
level = INFO
handlers =
qualname = bingarde

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
