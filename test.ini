# Settings for the test suite (pytest). DATABASE_URL points at the test database.
[app:main]
# How the web app is built: "call:<module>:<function>" (a PasteDeploy app factory).
use = call:bingarde.config.middleware:make_app
# false: tests see the same error pages as production.
debug = false
# Test database: postgresql+psycopg://<user>:<password>@<host>/<database>.
sqlalchemy.url = postgresql+psycopg://bingarde:bingarde@db/bingarde_test
# Sessions in memory: nothing to clean up between test runs.
session.type = memory
# Key that signs session cookies; a fixed value, for tests only.
session.secret = test-only-secret
# Tests store files on the local disk; tests/test_storage_*.py also try S3.
storage = local
# Upload folder; tests/conftest.py replaces it with a temporary folder (STORE_DIR).
store_dir = /tmp/bingarde-test-store
# Login with just an e-mail address, used by the tests to sign in.
dev_login = true
# A fake Google client id, so the Google login code can run without Google.
google_client_id = test-client-id
# The fake client's secret.
google_client_secret = test-client-secret
# Site address used for links in test e-mails.
base_url = http://localhost/
