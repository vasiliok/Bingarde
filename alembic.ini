# Alembic (database schema versions). The database URL comes from DATABASE_URL.
[alembic]
# Folder with env.py and the versions/ scripts. %(here)s = the folder of this file.
script_location = %(here)s/migration
# Paths added to sys.path before env.py runs; "." = project root, so "import bingarde" works.
prepend_sys_path = .
# How path lists in this file are split: os (the OS separator, ":" on Linux),
# or space, newline, ";" , ":".
path_separator = os

# Logging, in the format of Python's logging.config.fileConfig. Each [loggers],
# [handlers], [formatters] section only lists names ("keys"); every name then gets its
# own section: [logger_<name>], [handler_<name>], [formatter_<name>].
[loggers]
# Names of the configured loggers, comma-separated. "root" is required; add a name
# (and a [logger_<name>] section) to set the level of another library.
keys = root, alembic

[handlers]
# Names of the outputs. One here: "console". E.g. add "file" with a [handler_file]
# section to also write to a file.
keys = console

[formatters]
# Names of the line formats. "generic" is just the name of the one format below.
keys = generic

[logger_root]
# Minimum level: DEBUG, INFO, WARNING (WARN), ERROR, CRITICAL.
level = WARN
# Where its messages go: names from [handlers], comma-separated.
handlers = console

[logger_alembic]
# INFO shows every upgrade step; WARN would hide them.
level = INFO
# Empty: no own output, messages are passed up to the root logger's handlers.
handlers =
# The logger name used in the code (logging.getLogger("alembic")).
qualname = alembic

[handler_console]
# Handler class, looked up in Python's standard "logging" package:
#   logging module:          StreamHandler (console), FileHandler, NullHandler
#   logging.handlers module: written "handlers.<Name>", e.g. handlers.RotatingFileHandler,
#                            handlers.TimedRotatingFileHandler, handlers.SysLogHandler
# A full dotted path (e.g. mypackage.MyHandler) uses any other class.
class = StreamHandler
# Arguments for the class: the stream. (sys.stdout,) for standard output; for
# FileHandler a file name, e.g. ("alembic.log", "a").
args = (sys.stderr,)
# NOTSET: pass everything the loggers let through.
level = NOTSET
# Line format: a name from [formatters].
formatter = generic

[formatter_generic]
# %(levelname)-5.5s = level padded/cut to 5 characters, %(name)s = logger name,
# %(message)s = the text. Others: %(asctime)s (time), %(process)d, %(filename)s.
format = %(levelname)-5.5s [%(name)s] %(message)s
