# Settings for the Docker "run" stack. Environment variables override the settings
# named "(env X)"; secrets are only passed that way (see bingarde/config/middleware.py).
[app:main]
# How the web app is built: "call:<module>:<function>" (a PasteDeploy app factory).
use = call:bingarde.config.middleware:make_app
# true shows interactive error pages with code; must stay false in production.
debug = false
# Database: postgresql+psycopg://<user>:<password>@<host>/<database> (env DATABASE_URL).
sqlalchemy.url = postgresql+psycopg://bingarde:bingarde@db/bingarde
# true: test a pooled connection before use, so a database restart causes no errors.
sqlalchemy.pool_pre_ping = true

# Where uploaded build files are kept (env STORAGE): local = a folder on this machine
# (store_dir), s3 = an S3 bucket, AWS or S3-compatible (the s3_* settings below).
# See docs/storage.md.
storage = local
# Folder where uploaded build files are stored when storage = local (env STORE_DIR).
store_dir = /data/store
# Public address of the site, used for links in e-mails (env BASE_URL). With https://
# the session cookie is also marked Secure.
base_url = http://localhost:8080/

# Google domains allowed to sign in, comma-separated, e.g. "example.com, example.org";
# empty = any Google account (env ALLOWED_EMAIL_DOMAINS).
allowed_email_domains =
# Admin e-mails, comma-separated; admins may delete builds and files (env ADMIN_EMAILS).
admin_emails =
# E-mails that may not sign in or use their tokens, comma-separated; takes effect at
# once, also for open sessions (env BLOCKED_EMAILS).
blocked_emails =
# E-mails that may create and change builds and make write tokens, comma-separated;
# "*" = every signed-in user; empty = nobody but admins (env WRITER_EMAILS).
writer_emails =
# Same, by domain: users of these domains may write, comma-separated (env WRITER_DOMAINS).
writer_domains =
# Login with just an e-mail address, for demos: true / false (1, yes also work;
# env DEV_LOGIN). Never enable in production.
dev_login = false

# Only for storage = local. true: nginx sends downloads (X-Accel-Redirect) after the app
# checks access; needs the internal /_store/ location in nginx/default.conf.template.
# false: the app sends them.
xaccel = false

# S3 settings, used only when storage = s3. Credentials are never set here: boto3 reads
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, a profile or an IAM role.
# Bucket name; must exist already (env S3_BUCKET).
s3_bucket =
# Text put before every object key, e.g. "bingarde/" to share a bucket; empty = none
# (env S3_PREFIX).
s3_prefix =
# URL of an S3-compatible store, e.g. http://moto:5000; empty = AWS S3 (env S3_ENDPOINT).
s3_endpoint =
# URL the browser uses for download links, when it differs from s3_endpoint (a store in
# Docker: http://localhost:5000); empty = s3_endpoint (env S3_PUBLIC_ENDPOINT).
s3_public_endpoint =
# AWS region of the bucket, e.g. eu-central-1; empty = boto3's default (env S3_REGION).
s3_region =
# Seconds a download link stays valid; default 300 (env S3_URL_TTL).
s3_url_ttl = 300

# Largest request body in bytes for everything except file uploads; default 2 MB
# (env MAX_REQUEST_BODY). Upload size is limited by nginx (BINGARDE_MAX_UPLOAD).
max_request_body = 2097152

# Where sessions are kept: file (survives restarts), memory (lost on restart),
# dbm, or ext:database / ext:memcached (Beaker session types).
session.type = file
# Folder for the session files (env SESSION_DIR).
session.data_dir = /tmp/bingarde/sessions
# Folder for the lock files of the session files.
session.lock_dir = /tmp/bingarde/sessions/lock
# true: JavaScript cannot read the session cookie.
session.httponly = true
# When the browser sends the session cookie from other sites: Strict (never),
# Lax (only on normal links), None (always; needs https).
session.samesite = Lax
# Seconds without activity before the session ends; 1209600 = 14 days.
session.timeout = 1209600

# Logging, in the format of Python's logging.config.fileConfig. Each [loggers],
# [handlers], [formatters] section only lists names ("keys"); every name then gets its
# own section: [logger_<name>], [handler_<name>], [formatter_<name>].
[loggers]
# Names of the configured loggers, comma-separated. "root" is required; add a name
# (and a [logger_<name>] section) to set the level of another library.
keys = root, bingarde, sqlalchemy

[handlers]
# Names of the outputs. One here: "console". E.g. add "file" with a [handler_file]
# section to also write to a file.
keys = console

[formatters]
# Names of the line formats. "generic" is just the name of the one format below.
keys = generic

[logger_root]
# Minimum level for all libraries: DEBUG, INFO, WARNING (WARN), ERROR, CRITICAL.
level = INFO
# Where its messages go: names from [handlers]. The console is collected by Docker.
handlers = console

[logger_bingarde]
# Level of the app's own messages; DEBUG for more detail.
level = INFO
# Empty: no own output, messages are passed up to the root logger's handlers.
handlers =
# The logger name used in the app's code (all modules under "bingarde").
qualname = bingarde

[logger_sqlalchemy]
# WARN: only problems. INFO would log every SQL statement, DEBUG also the results.
level = WARN
# Empty: messages are passed up to the root logger's handlers.
handlers =
# SQLAlchemy's logger for SQL statements.
qualname = sqlalchemy.engine

[handler_console]
# Handler class, looked up in Python's standard "logging" package:
#   logging module:          StreamHandler (console), FileHandler, NullHandler
#   logging.handlers module: written "handlers.<Name>", e.g. handlers.RotatingFileHandler,
#                            handlers.TimedRotatingFileHandler, handlers.SysLogHandler
# A full dotted path (e.g. mypackage.MyHandler) uses any other class.
class = StreamHandler
# Arguments for the class: the stream. (sys.stdout,) for standard output; for
# FileHandler a file name, e.g. ("/var/log/bingarde.log", "a").
args = (sys.stderr,)
# NOTSET: pass everything the loggers let through.
level = NOTSET
# Line format: a name from [formatters].
formatter = generic

[formatter_generic]
# %(asctime)s = time, %(levelname)-5.5s = level padded/cut to 5 characters,
# %(name)s = logger name, %(message)s = the text. Others: %(process)d, %(filename)s.
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
