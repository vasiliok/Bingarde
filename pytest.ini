[pytest]
# Folders searched for tests (space-separated).
testpaths = tests
# Warnings to change, one per line: action:message:category:module.
# Actions: ignore, error (fail the test), default, always.
filterwarnings =
    # WebOb computes cookie expiry with the deprecated datetime.utcnow().
    ignore:datetime.datetime.utcnow:DeprecationWarning:webob.cookies
